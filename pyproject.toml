[build-system]
requires = ["setuptools>=45", "wheel", "setuptools_scm[toml]>=6.2"]
build-backend = "setuptools.build_meta"

[project]
name = "neural-chatbot"
dynamic = ["version"]
description = "An intelligent AI chatbot using neural networks"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "Neural Chatbot Team", email = "team@neural-chatbot.com"}
]
keywords = ["chatbot", "ai", "neural-network", "nlp", "tensorflow"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
]
requires-python = ">=3.8"
dependencies = [
    "numpy>=1.21.0,<2.0.0",
    "tensorflow>=2.8.0,<3.0.0",
    "nltk>=3.7,<4.0.0",
    "scikit-learn>=1.0.0,<2.0.0",
    "pandas>=1.3.0,<3.0.0",
    "flask>=2.0.0,<3.0.0",
    "flask-cors>=3.0.10,<5.0.0",
    "gunicorn>=20.1.0,<22.0.0",
    "pyyaml>=6.0,<7.0.0",
    "marshmallow>=3.14.0,<4.0.0",
    "python-dotenv>=0.19.0,<2.0.0",
    "click>=8.0.0,<9.0.0",
    "colorlog>=6.0.0,<7.0.0",
    "psutil>=5.8.0,<6.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "pytest-mock>=3.8.0",
    "black>=22.0.0",
    "flake8>=5.0.0",
    "mypy>=0.991",
    "isort>=5.10.0",
    "pre-commit>=2.20.0",
]
plot = [
    "matplotlib>=3.5.0",
    "seaborn>=0.11.0",
    "plotly>=5.0.0",
]
production = [
    "redis>=4.5.0",
    "celery>=5.2.0",
    "prometheus-client>=0.15.0",
    "sentry-sdk[flask]>=1.15.0",
]

[project.scripts]
neural-chatbot = "neural_chatbot.main:main"
neural-chatbot-train = "neural_chatbot.core.trainer:main"
neural-chatbot-serve = "neural_chatbot.api.app:main"

[project.urls]
Homepage = "https://github.com/PawanRamaMali/neural-chatbot"
Documentation = "https://neural-chatbot.readthedocs.io/"
Repository = "https://github.com/PawanRamaMali/neural-chatbot.git"
"Bug Tracker" = "https://github.com/PawanRamaMali/neural-chatbot/issues"

[tool.setuptools_scm]
write_to = "src/neural_chatbot/_version.py"

[tool.black]
line-length = 100
target-version = ['py38']
include = '\\.pyi?$'
extend-exclude = '''
/(
  \\.eggs
  | \\.git
  | \\.hg
  | \\.mypy_cache
  | \\.tox
  | \\.venv
  | _build
  | buck-out
  | build
  | dist
)/
'''

[tool.isort]
profile = "black"
line_length = 100
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true

[tool.mypy]
python_version = "3.8"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short --strict-markers"
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
    "unit: marks tests as unit tests",
]

[tool.coverage.run]
source = ["src/neural_chatbot"]
omit = [
    "*/tests/*",
    "*/test_*",
    "*/__pycache__/*",
    "*/venv/*",
    "*/virtualenv/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if self.debug:",
    "if settings.DEBUG",
    "raise AssertionError",
    "raise NotImplementedError",
    "if 0:",
    "if __name__ == .__main__.:",
    "class .*\\(.*Protocol\\):",
    "@(abc\\.)?abstractmethod",
]